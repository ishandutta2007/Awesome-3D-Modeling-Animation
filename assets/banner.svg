<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Vibrant Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a21caf" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.6; }
    .pulse-circle { animation: pulse 4s ease-in-out infinite alternate; }
    .float-slow { animation: float 8s ease-in-out infinite alternate; }
    .rotate-wireframe { transform-origin: 1040px 210px; animation: spinWireframe 30s linear infinite; }
    .rotate-wireframe-rev { transform-origin: 1040px 210px; animation: spinWireframeRev 45s linear infinite; }
    .wave-pulse { animation: waveDrift 10s ease-in-out infinite alternate; }
    
    @keyframes spinWireframe {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.04); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes spinWireframeRev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes waveDrift {
      0% { transform: translateX(0px) skewX(0deg); }
      100% { transform: translateX(-30px) skewX(-2deg); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- DYNAMIC BACKGROUND LAYER: Perspective 3D Grid Floor -->
  <g opacity="0.35">
    <line x1="0" y1="420" x2="350" y2="280" class="grid-line" />
    <line x1="120" y1="420" x2="420" y2="280" class="grid-line" />
    <line x1="260" y1="420" x2="490" y2="280" class="grid-line" />
    <line x1="420" y1="420" x2="560" y2="280" class="grid-line" />
    <line x1="600" y1="420" x2="630" y2="280" class="grid-line" />
    <line x1="780" y1="420" x2="700" y2="280" class="grid-line" />
    <line x1="960" y1="420" x2="770" y2="280" class="grid-line" />
    <line x1="1120" y1="420" x2="840" y2="280" class="grid-line" />
    <line x1="1200" y1="380" x2="910" y2="280" class="grid-line" />
    
    <!-- Horizontal Perspective Lines -->
    <line x1="50" y1="410" x2="1180" y2="410" class="grid-line" />
    <line x1="120" y1="390" x2="1140" y2="390" class="grid-line" />
    <line x1="200" y1="365" x2="1080" y2="365" class="grid-line" />
    <line x1="260" y1="335" x2="1010" y2="335" class="grid-line" />
    <line x1="310" y1="305" x2="940" y2="305" class="grid-line" />
    <line x1="350" y1="280" x2="870" y2="280" class="grid-line" />
  </g>

  <!-- Ambient Light Orbs with Pulse Animation -->
  <circle cx="1020" cy="210" r="190" fill="#38bdf8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="opacity" values="0.10;0.22;0.10" dur="6s" repeatCount="indefinite" />
    <animate attributeName="r" values="180;210;180" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="80" r="160" fill="#818cf8" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.06;0.15;0.06" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="380" r="140" fill="#c084fc" opacity="0.08" filter="url(#glow)" />

  <!-- DYNAMIC BACKGROUND LAYER: Animated 3D Wireframe Polyhedron & Spline Network (Right Side) -->
  <g class="rotate-wireframe">
    <!-- Outer Octahedron / Icosahedron Facets -->
    <polygon points="1040,80 1150,170 1120,280 1040,330 950,270 930,160" fill="url(#polyGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="1040" y1="80" x2="1040" y2="330" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 4" />
    <line x1="930" y1="160" x2="1150" y2="170" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 4" />
    <line x1="950" y1="270" x2="1120" y2="280" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 4" />
    <line x1="1040" y1="80" x2="1040" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="1150" y1="170" x2="1040" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="1120" y1="280" x2="1040" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="1040" y1="330" x2="1040" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="950" y1="270" x2="1040" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="930" y1="160" x2="1040" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    
    <!-- Floating Vertices with Glowing Accents -->
    <circle cx="1040" cy="80" r="4" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <circle cx="1150" cy="170" r="4" fill="#818cf8" filter="url(#subtleGlow)"/>
    <circle cx="1120" cy="280" r="4" fill="#c084fc" filter="url(#subtleGlow)"/>
    <circle cx="1040" cy="330" r="4" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <circle cx="950" cy="270" r="4" fill="#818cf8" filter="url(#subtleGlow)"/>
    <circle cx="930" cy="160" r="4" fill="#c084fc" filter="url(#subtleGlow)"/>
    <circle cx="1040" cy="210" r="6" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Counter-rotating Inner Cage -->
  <g class="rotate-wireframe-rev">
    <circle cx="1040" cy="210" r="140" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 8" />
    <ellipse cx="1040" cy="210" rx="140" ry="50" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" transform="rotate(35 1040 210)"/>
    <ellipse cx="1040" cy="210" rx="140" ry="50" fill="none" stroke="#ec4899" stroke-width="1" stroke-opacity="0.2" transform="rotate(-40 1040 210)"/>
  </g>

  <!-- Dynamic Particle Nodes Flowing in Background -->
  <g opacity="0.45">
    <circle cx="820" cy="110" r="2.5" fill="#38bdf8">
      <animate attributeName="cy" values="110;95;110" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="760" cy="190" r="2" fill="#818cf8">
      <animate attributeName="cy" values="190;175;190" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="890" cy="290" r="3" fill="#c084fc">
      <animate attributeName="cy" values="290;305;290" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="680" cy="140" r="2" fill="#06b6d4">
      <animate attributeName="cy" values="140;130;140" dur="5.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ========================================================================= -->
  <!-- FOREGROUND LAYER: Crisp Content, Badges & Typography (Never Obstructed)  -->
  <!-- ========================================================================= -->

  <!-- Top Category Badge Pill -->
  <g transform="translate(70, 52)">
    <rect width="270" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="16" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(70, 138)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.8">
      Awesome 3D Modeling
    </text>
    <text y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.8">
      &amp; Animation Platforms
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(70, 240)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      The definitive directory of commercial DCC suites, SaaS creation tools,
    </text>
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      and production-grade open-source pipelines for VFX, gaming &amp; spatial design.
    </text>
  </g>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(70, 318)">
    <!-- Pill 1: Modeling & Sculpting -->
    <g transform="translate(0, 0)">
      <rect width="168" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">🎨 3D Modeling &amp; Sculpt</text>
    </g>

    <!-- Pill 2: Rigging & Animation -->
    <g transform="translate(180, 0)">
      <rect width="162" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">🦴 Rigging &amp; Anim</text>
    </g>

    <!-- Pill 3: Procedural & VFX -->
    <g transform="translate(354, 0)">
      <rect width="162" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">⚡ Procedural &amp; VFX</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(528, 0)">
      <rect width="156" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8">🌐 Open Pipelines</text>
    </g>
  </g>

  <!-- Subtle Bottom Border Accent -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#titleGrad)" />
</svg>
